<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Vanchi Vikash P M">
  <!-- Just the V. No tile: at tab size a solid square is the loudest thing in
       the strip, and the letterform alone is lighter and reads as a mark
       rather than an app icon. The fill flips with the OS scheme so it keeps
       contrast against either browser chrome. -->
  <style>
    .v { fill: #000; }
    @media (prefers-color-scheme: dark) { .v { fill: #fff; } }
  </style>
  <path class="v" d="M8 18 L33 18 L50 60 L67 18 L92 18 L50 90 Z"/>
</svg>
