<?xml version="1.0" encoding="UTF-8"?>
<svg style="color:#000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1616 1077" width="1616" height="1077">
        <defs>
          <pattern id="f6h" width="16" height="16" patternUnits="userSpaceOnUse">
            <path d="M-4,4 L4,-4 M0,16 L16,0 M12,20 L20,12" style="fill: none; stroke: currentcolor; stroke-width: 1.4; opacity: 0.3;"/>
          </pattern>
          <pattern id="f6d" width="7" height="7" patternUnits="userSpaceOnUse">
            <path d="M-2,2 L2,-2 M0,7 L7,0 M5,9 L9,5" style="fill: none; stroke: currentcolor; stroke-width: 1.3; opacity: 0.5;"/>
          </pattern>
          <marker id="f6a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M0,0 L12,6 L0,12 z" style="fill: currentcolor;"/>
          </marker>
        </defs>

        <text x="120" y="60" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 34px; font-weight: 600;">Five layers, and the network is the last one</text>
        <text x="120" y="100" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px; opacity: 0.55;">Each layer only passes on what it cannot decide.</text>
        <text x="120" y="134" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px; opacity: 0.45;">Band widths are illustrative — per-layer resolve rates are not measured in the repository.</text>

        <polygon points="220,200 820,200 738,336 302,336" style="fill: url(&quot;#f6h&quot;); stroke: currentcolor; stroke-width: 2.2;"/>
        <polygon points="302,356 738,356 670,492 370,492" style="fill: url(&quot;#f6h&quot;); stroke: currentcolor; stroke-width: 2.2;"/>
        <polygon points="370,512 670,512 618,648 422,648" style="fill: url(&quot;#f6h&quot;); stroke: currentcolor; stroke-width: 2.2;"/>
        <polygon points="422,668 618,668 570,804 470,804" style="fill: url(&quot;#f6h&quot;); stroke: currentcolor; stroke-width: 2.2;"/>
        <polygon points="470,824 570,824 535,960 505,960" style="fill: url(&quot;#f6d&quot;); stroke: currentcolor; stroke-width: 3.4;"/>

        <text x="520" y="292" fill="currentColor" style="font-family: &quot;IBM Plex Mono&quot;, monospace; font-size: 64px; text-anchor: middle;">1</text>
        <text x="520" y="448" fill="currentColor" style="font-family: &quot;IBM Plex Mono&quot;, monospace; font-size: 64px; text-anchor: middle;">2</text>
        <text x="520" y="604" fill="currentColor" style="font-family: &quot;IBM Plex Mono&quot;, monospace; font-size: 64px; text-anchor: middle;">3</text>
        <text x="520" y="760" fill="currentColor" style="font-family: &quot;IBM Plex Mono&quot;, monospace; font-size: 64px; text-anchor: middle;">4</text>
        <text x="520" y="916" fill="currentColor" style="font-family: &quot;IBM Plex Mono&quot;, monospace; font-size: 52px; text-anchor: middle;">5</text>

        <path d="M302,346 H150" marker-end="url(#f6a)" style="fill: none; stroke: currentcolor; stroke-width: 1.6; opacity: 0.75;"/>
        <path d="M370,502 H150" marker-end="url(#f6a)" style="fill: none; stroke: currentcolor; stroke-width: 1.6; opacity: 0.75;"/>
        <path d="M422,658 H150" marker-end="url(#f6a)" style="fill: none; stroke: currentcolor; stroke-width: 1.6; opacity: 0.75;"/>
        <path d="M470,814 H150" marker-end="url(#f6a)" style="fill: none; stroke: currentcolor; stroke-width: 1.6; opacity: 0.75;"/>
        <text x="144" y="332" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px; text-anchor: end; opacity: 0.7;">resolved</text>
        <text x="144" y="488" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px; text-anchor: end; opacity: 0.7;">resolved</text>
        <text x="144" y="644" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px; text-anchor: end; opacity: 0.7;">resolved</text>
        <text x="144" y="800" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px; text-anchor: end; opacity: 0.7;">resolved</text>

        <text x="860" y="250" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 32px; font-weight: 600;">in-memory cache</text>
        <text x="860" y="288" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px; opacity: 0.65;">1-hour TTL, per service-worker lifetime</text>
        <text x="860" y="322" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px; opacity: 0.65;">a link scanned once is not scanned again</text>

        <text x="860" y="406" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 32px; font-weight: 600;">local blocklists</text>
        <text x="860" y="444" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px; opacity: 0.65;">URLhaus · OpenPhish · ThreatFox · Community</text>
        <text x="860" y="478" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px; opacity: 0.65;">IndexedDB, refreshed daily, matched in memory</text>

        <text x="860" y="562" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 32px; font-weight: 600;">heuristics</text>
        <text x="860" y="600" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px; opacity: 0.65;">India-specific scam patterns, sketchy TLDs,</text>
        <text x="860" y="634" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px; opacity: 0.65;">subdomain depth over 4 labels</text>

        <text x="860" y="718" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 32px; font-weight: 600;">on-device ML</text>
        <text x="860" y="756" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px; opacity: 0.65;">TF-IDF + logistic regression · 57,750 features</text>
        <text x="860" y="790" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px; opacity: 0.65;">~200 µs per URL · decides alone at ≥ 90%</text>

        <text x="860" y="874" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 32px; font-weight: 600;">VirusTotal API</text>
        <text x="860" y="912" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px; opacity: 0.65;">the only network call, on the user's own key</text>
        <text x="860" y="946" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px; opacity: 0.65;">free tier: 4 per minute, 500 per day</text>
        <text x="860" y="1000" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 30px; font-weight: 600;">almost never reached</text>

        <path d="M535,960 H660 V992 H846" style="fill: none; stroke: currentcolor; stroke-width: 1.4; stroke-dasharray: 5, 6; opacity: 0.55;"/>
        <text x="120" y="1042" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px; opacity: 0.5;">Links to ~50 trusted domains never enter the pipeline at all — no cache lookup, no message to the worker.</text>
      </svg>