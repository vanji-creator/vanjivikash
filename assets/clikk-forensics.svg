<?xml version="1.0" encoding="UTF-8"?>
<svg style="color:#000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1616 909" width="1616" height="909">
        <defs>
          <pattern id="f5a" width="14" height="14" patternUnits="userSpaceOnUse">
            <path d="M-3,3 L3,-3 M0,14 L14,0 M11,17 L17,11" style="fill: none; stroke: currentcolor; stroke-width: 1.4; opacity: 0.38;"/>
          </pattern>
          <pattern id="f5b" width="14" height="14" patternUnits="userSpaceOnUse">
            <path d="M-3,11 L3,17 M0,0 L14,14 M11,-3 L17,3" style="fill: none; stroke: currentcolor; stroke-width: 1.4; opacity: 0.38;"/>
          </pattern>
        </defs>

        <text x="120" y="60" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 34px; font-weight: 600;">Almost perfectly symmetric disagreement</text>
        <text x="120" y="98" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px; opacity: 0.55;">a widely-used public Kaggle malicious-URL dataset, cross-checked against URLhaus, OpenPhish and ThreatFox</text>

        <text x="120" y="164" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px; opacity: 0.65;">the overlap between the dataset and the feeds</text>
        <rect x="120" y="182" width="1370" height="34" style="fill: url(&quot;#f5a&quot;); stroke: currentcolor; stroke-width: 2;"/>
        <rect x="1490" y="182" width="6" height="34" style="fill: currentcolor; stroke: currentcolor; stroke-width: 2;"/>
        <path d="M1493,216 V240" style="stroke: currentcolor; stroke-width: 1.2;"/>
        <text x="120" y="270" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px;">disagree ≈ 99.99%</text>
        <text x="1493" y="270" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px; text-anchor: end; opacity: 0.7;">agree ≈ 0.01% — drawn at visible width</text>

        <path d="M120,480 H1300" style="stroke: currentcolor; stroke-width: 1.4; stroke-dasharray: 6, 7; opacity: 0.65;"/>

        <rect x="120" y="330" width="1160" height="140" style="fill: url(&quot;#f5a&quot;); stroke: currentcolor; stroke-width: 2.4;"/>
        <text x="160" y="428" fill="currentColor" style="font-family: &quot;IBM Plex Mono&quot;, monospace; font-size: 80px;">48,009</text>
        <text x="520" y="388" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 30px;">the dataset says phishing</text>
        <text x="520" y="428" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 30px; opacity: 0.65;">the feeds say benign</text>

        <rect x="120" y="490" width="1157" height="140" style="fill: url(&quot;#f5b&quot;); stroke: currentcolor; stroke-width: 2.4;"/>
        <text x="160" y="588" fill="currentColor" style="font-family: &quot;IBM Plex Mono&quot;, monospace; font-size: 80px;">47,903</text>
        <text x="520" y="548" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 30px;">the dataset says benign</text>
        <text x="520" y="588" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 30px; opacity: 0.65;">the feeds say phishing</text>

        <path d="M1280,306 V330 M1277,630 V654" style="stroke: currentcolor; stroke-width: 1.6;"/>
        <text x="1320" y="420" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px;">the two ends</text>
        <text x="1320" y="452" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px;">differ by</text>
        <text x="1320" y="512" fill="currentColor" style="font-family: &quot;IBM Plex Mono&quot;, monospace; font-size: 48px;">106</text>
        <text x="1320" y="550" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px; opacity: 0.6;">URLs · 0.22%</text>

        <text x="120" y="736" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 30px; font-weight: 600;">Noise leans one way. A swap is symmetric.</text>
        <text x="120" y="782" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px; opacity: 0.7;">95,912 of the overlapping URLs disagree with the feeds: 48,009 in one direction,</text>
        <text x="120" y="816" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px; opacity: 0.7;">47,903 in the other — a difference of 106 URLs, or 0.22% of either side.</text>
        <text x="120" y="850" fill="currentColor" style="font-family: &quot;Instrument Sans&quot;, sans-serif; font-size: 26px; opacity: 0.7;">Honest-but-noisy labelling produces one-directional bias, not this.</text>
      </svg>